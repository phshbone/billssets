 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Band Setlist Player</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 20px; }
        .list-container { max-width: 500px; margin: auto; }
        .song-btn { 
            display: block; width: 100%; padding: 15px; margin: 10px 0; 
            background: #282828; border: none; color: white; 
            text-align: left; font-size: 18px; border-radius: 8px; cursor: pointer;
        }
        .song-btn:hover { background: #1DB954; }
    </style>
</head>
<body>
    <div class="list-container">
        <h1>Set 1 Playlist</h1>
        <div id="playlist"></div>
    </div>

    <script>
        const setlist = [
            { title: "Dim Lights, Thick Smoke", url: "https://www.youtube.com/watch?v=FqS73qM4P88" },
            { title: "As Good As I Once Was", url: "https://www.youtube.com/watch?v=i9OLKSOmZwA" },
            { title: "Two More Bottles Of Wine", url: "https://www.youtube.com/watch?v=D001Jt2G5W8" },
            { title: "Blame it on Your Heart", url: "https://www.youtube.com/watch?v=k5_d2yqZ_lE" },
            { title: "Every Little Thing", url: "https://www.youtube.com/watch?v=bPPNPhJSb5Y" },
            { title: "Working Man Blues", url: "https://www.youtube.com/watch?v=q6j7tHh311c" },
            { title: "She's In Love With The Boy", url: "https://www.youtube.com/watch?v=W55yJ8n7M-Y" },
            { title: "Six Days On The Road", url: "https://www.youtube.com/watch?v=q7a8qQhE_5s" },
            { title: "She's Crazy for Leavin'", url: "https://www.youtube.com/watch?v=Sz_7G8fOyG8" },
            { title: "Good Hearted Woman", url: "https://www.youtube.com/watch?v=aKw834trRWo" },
            { title: "Tennessee Whiskey", url: "https://www.youtube.com/watch?v=4zAThXBR_rY" },
            { title: "One More Last Chance", url: "https://www.youtube.com/watch?v=aGfgIQfpbWI" },
            { title: "Suds In The Bucket", url: "https://www.youtube.com/watch?v=qE4c4X67Y_c" },
            { title: "I Never Lie", url: "https://www.youtube.com/watch?v=Gk3wR8z1h4g" },
            { title: "I Try To Think About Elvis", url: "https://www.youtube.com/watch?v=inDsXwyyr4Y" }
        ];

        const container = document.getElementById('playlist');
        setlist.forEach(song => {
            const btn = document.createElement('button');
            btn.className = 'song-btn';
            btn.innerText = song.title;
            btn.onclick = () => window.open(song.url, '_blank');
            container.appendChild(btn);
        });
    </script>
</body>
</html>
